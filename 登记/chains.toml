# 推演链（第四轮第 3 步，2026-10-27 登记 v1）。规则在 口径.md 第十一节，代码 qx/smallsignal.py。
# 每条链按顺序列几环；每一环写"哪个价格先动"（series：这一环的读数，出现偏高以上的小信号就算"亮"）和"哪天的数据能证实或证伪"（check）。
# 程序盯着下一环：前一环亮了以后 20 个交易日内下一环也亮，算"推演链往下走了一环"（推送，第 5 步并进"三种走向的信号先出现"）。
# 只增不改：改链、改环加新版本（version、since），旧的写 until。

version = 1
since = "2026-10-27"
window = 20

[[chain]]
id = "ai_fin"
name = "AI 融资"
links = [
  { name = "neocloud 信用", series = ["BAMLH0A2HYB", "BAMLH0A1HYBB", "CRWV", "NBIS"], stress = ["up", "up", "down", "down"], check = "单 B、BB 利差（FRED 次日）；CoreWeave、Nebius 发债和股价" },
  { name = "云大厂融资", series = ["BAMLC0A0CM", "ORCL", "META"], stress = ["up", "down", "down"], check = "投资级利差；甲骨文、Meta 发债；云大厂财报的资本开支指引" },
