# 美国非农就业（BLS Employment Situation，非农就业和失业率同一份）的发布日表：纳斯达克宏观日历漏了非农时的后备（新3，口径十四.1 更正）。
# BLS 自己的日程对程序回 403，程序不去取，这张表是手抄的。qx/events.py bls_nfp() 读它。
#
# 抄自：https://www.bls.gov/schedule/news_release/empsit.htm（页面标题 "Schedule of Releases for the Employment Situation"）
# 哪天抄的：2026-10-31，用浏览器打开那一页照着抄（Reference Month / Release Date / Release Time 三栏）。
# 哪一年：那一页当时列的是参考月 2026 年 10 月到 2027 年 11 月，发布日 2026-11-06 到 2027-12-03，共 14 次；
#         发布时刻都是美东 08:30 AM。2026 年更早的几次那一页已经不列，没抄。
#
# 表里没有的月份（比如 2027-12 以后）：页面写"约 M/D（估的）"，只进"再往后"那一行，不进 ④ 的状态词，不算口径三.8 的大事。
# 估法（qx/events.py nfp_est()，口径十四.1 新3 复查改正）：参考周（参考月里含 12 号的那一周）结束以后的第三个周五，1 月 1–3 日的往后挪一周，
# 7 月 3、4 日的提前到周四；2010 年以来 201 次里 196 次对得上（对不上的都是政府停摆），这张表的 14 次全对得上。
# 不按"每月第一个周五"估：201 次里 35 次不在第一个周五，2025-10 根本没发布。
# 下一份：BLS 每年出下一年的表，到时候照这个格式往下加，写明哪天从哪页抄的；抄过的不改。

