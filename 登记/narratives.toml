# "市场在交易什么"的登记表（第四轮第 2 步，2026-10-27 登记 v1）。规则在 口径.md 第十节，代码 qx/narrative.py。
# 只增不改：改一个篮子、换配对的读数、改结束信号，都加新版本（version 加 1、since），旧的写 until。回放只用当天在用的版本。
# 哪条是主线由算出来的数认，不由人定。

version = 1
since = "2026-10-27"

# 规则（两样都满足才算主线，这是一层合成）：
#   1. 这个篮子是"领跌的篮子"：20 日涨跌按各成员自己的长期日波动折算（÷ 日波动 × √20）后取中位数，在所有篮子里最低，而且 ≤ lead_max。
#   2. 配对的信用（或宏观）读数"偏高以上"：读数的 20 日变化，在当天以前的全部历史里，同方向比它更极端的不超过 5%（不超过 1% 写"少见"）。
lead_max = -1.0
high_pct = 0.05
rare_pct = 0.01

