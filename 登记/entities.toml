      "power", "grid", "data center delay", "data center cancel", "cancels data center", "delays data center", "资本开支", "指引", "订单", "产能",
      "涨价", "降价", "合约价", "电力", "数据中心"]

[[line]]
id = "geo"
name = "地缘和政策"
