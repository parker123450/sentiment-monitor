# 快讯打标签用的登记表（第四轮第 1 步，2026-10-27 登记 v1）。规则在 口径.md 第九节。
#
# 只增不改：要改某一条，就加一条新版本（version 加 1、写 since），旧的写 until（停用日）。
# 回放和检验只用当天已经登记、还没停用的版本。
# 公司和机构的别名区分大小写、英文按整词；六条线的关键词不分大小写、英文按整词（允许 s/es/d/ed/ing 词尾），以 * 结尾的按词头；中文按字面。watch = true 的是观察名单（推送"第一次"只看观察名单）。

