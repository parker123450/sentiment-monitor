[[group]]
id = "private_credit"
name = "私募信贷"
alias = ["private credit", "私募信贷", "私人信贷"]
watch = true

# ---------------------------------------------------------------- 六条线
[[line]]
id = "credit"
name = "融资和信用"
kw = ["bond", "bonds", "notes offering", "loan", "credit facility", "covenant", "downgrade", "downgraded", "default", "CDS", "credit default swap",
      "spread", "spreads", "private credit", "refinanc*", "convertible", "at-the-market", "share sale", "stock sale", "IPO delay", "IPO postpone",
      "pulls IPO", "postpones IPO", "writedown", "write-down", "debt", "borrow*", "发债", "债券", "贷款", "降级", "违约", "信用利差", "融资", "增发", "可转债"]

[[line]]
id = "industry"
