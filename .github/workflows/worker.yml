# 雷达 Worker：worker/ 有改动就跑测试（不用 Secret）；部署只在手动触发、而且 CLOUDFLARE_API_TOKEN 已经加了的时候做。
# 部署：建表（D1 migrations）→ wrangler deploy → 把令牌和推送渠道的钥匙从 GitHub Secrets 写进 Worker（不回显）。
# Cloudflare 的操作全在这里做，不在用户 Mac 上装 wrangler。

name: 雷达 Worker

on:
  push:
    branches: [radar, main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "部署（要先加 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 检查
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "还没加 Cloudflare 的 Secret"; exit 1; }
          grep -q 'TO-BE-SET' wrangler.toml && { echo "先跑 worker-setup.yml 建 D1"; exit 1; } || true
      # wrangler 的输出里有 workers.dev 子域名（带账号名）和账号 ID：公开仓库的日志谁都能看，只打"好了 / 没成功"，出错时打遮过的最后几行
      - name: 建表、部署
        run: |
          mask() { sed -E 's#[A-Za-z0-9._-]+\.workers\.dev#***.workers.dev#g; s#[0-9a-fA-F]{32}#***#g; s#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#***@***#g'; }
          npx --yes wrangler@4 d1 migrations apply qx-radar --remote > /tmp/m.log 2>&1 || { echo "建表没成功："; tail -n 20 /tmp/m.log | mask; exit 1; }
          echo "建表：好了"
          npx --yes wrangler@4 deploy > /tmp/d.log 2>&1 || { echo "部署没成功："; tail -n 20 /tmp/d.log | mask; exit 1; }
          echo "部署：好了"
      - name: 写入令牌和推送渠道的钥匙（不回显）
        env:
          READ_TOKEN: ${{ secrets.WORKER_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.WORKER_WRITE_TOKEN }}
          BRIEF_TOKEN: ${{ secrets.WORKER_BRIEF_TOKEN }}
          INGEST_TOKEN: ${{ secrets.WORKER_INGEST_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          for k in READ_TOKEN WRITE_TOKEN BRIEF_TOKEN INGEST_TOKEN NTFY_TOPIC WECOM_KEY BARK_KEY; do
            v="${!k}"; [ -n "$v" ] || continue
            if printf '%s' "$v" | npx --yes wrangler@4 secret put "$k" > /tmp/s.log 2>&1; then echo "写入 $k"; else echo "写入 $k 没成功"; exit 1; fi
          done
