# 情绪面板 · 每 15 分钟跑一次（2026-10-23 用户定的做法 A：公开仓库、网页加密码、数据加密）
#
# 每次：取回行情缓存和 data 分支上加密的小文件 → python run.py auto（自己决定这次抓什么、算不算）→
#       页面（有 PAGE_PASSWORD 才生成，整页加密）发布到 Pages → 完整期权链存档加密后传到 Releases → 小文件加密存回 data 分支。
# GitHub 的定时用 UTC，负载高时会晚 5–30 分钟、偶尔跳过一次。新仓库的定时有时要等一阵才开始触发。
# Secrets：PAGE_PASSWORD（网页密码，用户自己设）、DATA_KEY（加密数据的钥匙，本机 ~/.config/qx/data_key 有一份）、
#          NTFY_TOPIC（推送频道，本机 ~/.config/qx/ntfy_topic）、FEEDBACK_TOPIC（页面发试用记录的频道，本机 ~/.config/qx/feedback_topic）。
#          第四轮（雷达）可选，没加就是空的、相应的功能不开：WORKER_URL、WORKER_WRITE_TOKEN、WORKER_READ_TOKEN（Cloudflare Worker）、
#          WECOM_KEY、BARK_KEY（另外两个推送渠道）、SEC_CONTACT（SEC 要的联系邮箱）。

name: 每 15 分钟

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write     # data 分支、Releases
  actions: write      # 清理旧的行情缓存
  pages: write
  id-token: write

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      page: ${{ steps.done.outputs.page }}
    env:
      PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
      DATA_KEY: ${{ secrets.DATA_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      FEEDBACK_TOPIC: ${{ secrets.FEEDBACK_TOPIC }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_WRITE_TOKEN: ${{ secrets.WORKER_WRITE_TOKEN }}
      WORKER_READ_TOKEN: ${{ secrets.WORKER_READ_TOKEN }}
      WECOM_KEY: ${{ secrets.WECOM_KEY }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 遮住 Worker 的主机名（workers.dev 子域名里有账号，公开日志里不出现）
        run: |
          h=$(printf '%s' "$WORKER_URL" | sed -E 's#^[A-Za-z]+://##; s#/.*$##')
          if [ -n "$h" ]; then echo "::add-mask::$h"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 取回行情缓存
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: 取回 data 分支上加密的小文件
        id: restore
        run: |
          set -e
          [ -n "$DATA_KEY" ] || { echo "没有 DATA_KEY，不跑"; exit 1; }
          mkdir -p data
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:data.enc > /tmp/data.enc
            python run.py unpack /tmp/data.enc
          else
            echo "还没有 data 分支，从头攒"
          fi
          echo "n=$(find data -type f -not -path 'data/raw/*' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: 跑（抓数据、算、生成页面）
        id: run
        run: python run.py auto

      - name: 完整期权链存档（加密）传到 Releases
        if: always() && hashFiles('data/out/upload.txt') != ''
        run: |
          for f in $(cat data/out/upload.txt); do
            d=$(basename "$f" .enc); day=${d#chains-}; tag="chains-${day:0:7}"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "期权链存档 ${day:0:7}" --notes "每个美股交易日收盘后一份完整期权链（CBOE 延迟报价），已加密。"
            gh release upload "$tag" "$f" --clobber && python run.py uploaded "$f"
          done

      - name: 小文件加密存回 data 分支
        if: always() && steps.restore.outcome == 'success'
        run: |
          set -e
          now=$(find data -type f -not -path 'data/raw/*' -not -path 'data/out/*' | wc -l)
          if [ "$now" -lt "${{ steps.restore.outputs.n }}" ]; then echo "文件比取回来的少（$now < ${{ steps.restore.outputs.n }}），不存，防止把攒下的历史盖掉"; exit 1; fi
          D=$(mktemp -d)
          python run.py pack "$D/data.enc"
          cd "$D"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# data 分支\n\n只有一个加密文件 data.enc：面板每 15 分钟攒下来的小文件（日志、认沽认购历史、期权链摘要、CNN、预测市场、要闻）。钥匙不在仓库里。每次覆盖，只留最新一份。\n' > README.md
          git add -A
          git commit -q -m "数据 $(date -u '+%F %H:%M') UTC"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: 保存行情缓存（这次下载过日线才存）
        if: always() && hashFiles('data/out/raw_changed') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - name: 只留最新 3 份行情缓存
        if: always() && hashFiles('data/out/raw_changed') != ''
        run: |
          gh cache list --key raw- --sort created_at --order desc --limit 50 --json id -q '.[3:][].id' | xargs -r -n1 gh cache delete || true

      - name: 网页（加密的）
        id: done
        if: always() && hashFiles('site/index.html') != ''
        run: echo "page=1" >> "$GITHUB_OUTPUT"

      - name: 打包网页
        if: always() && steps.done.outputs.page == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    if: always() && needs.run.outputs.page == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHub 的定时没触发时接力：上一次定时触发在 40 分钟以前（或从来没有），就等到这次开始后 15 分钟，自己再叫一次。
  # 定时恢复正常以后这一步自动不做。要停掉整个面板：gh workflow disable run.yml
  next:
    needs: [run, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 定时不触发时接力
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=schedule&per_page=1" --jq '.workflow_runs[0].created_at // ""')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 2400 ]; then echo "定时在正常触发（上一次 $last），不接力"; exit 0; fi
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          wait=$(( 900 - ( $(date +%s) - $(date -d "$started" +%s) ) ))
          if [ "$wait" -gt 0 ]; then echo "等 $wait 秒"; sleep "$wait"; fi
          q=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=1" --jq '.total_count')
          if [ "$q" -gt 0 ]; then echo "已经有排队的，不接力"; exit 0; fi
          gh workflow run run.yml -R "$GITHUB_REPOSITORY" && echo "已叫下一次"
